name: Supabase Keep Alive

on:
  schedule:
    # 毎週月曜 0:00 UTC（日本時間 月曜 9:00）に実行
    - cron: '0 0 * * 1'
  workflow_dispatch: {}

# 空コミットをpushするために必要
permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/sansu_questions?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"

      # 60日間コミットがないとGitHubが定期実行を自動停止するため、
      # 最後のコミットから45日以上たっていたときだけ空コミットを積む。
      # [skip ci] でVercelの無駄な再デプロイを防ぐ。
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          echo "Days since last commit: $days"
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflow alive [skip ci]"
            git push
          fi
